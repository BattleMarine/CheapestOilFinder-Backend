spring:
  application:
    name: oil-price-db-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/oil_price_db}
    username: ${DB_USER:oil_user}
    password: ${DB_PASSWORD:oil_password}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

opinet:
  base-url: ${OPINET_BASE_URL:http://www.opinet.co.kr/api}
  api-key: ${OPINET_API_KEY:}
  api-key-file: ${OPINET_API_KEY_FILE:./secrets/opinet-api-key.txt}
  enabled: ${OPINET_ENABLED:true}
  call-interval-millis: ${OPINET_CALL_INTERVAL_MILLIS:30000}

app:
  recommendation:
    default-radius-meters: 5000
    default-refuel-liters: 30
    default-fuel-efficiency-km-per-liter: 10

naver:
  directions:
    base-url: ${NAVER_DIRECTIONS_BASE_URL:https://maps.apigw.ntruss.com/map-direction/v1}
    api-key-id: ${NAVER_DIRECTIONS_API_KEY_ID:}
    api-key: ${NAVER_DIRECTIONS_API_KEY:}
    api-key-file: ${NAVER_DIRECTIONS_API_KEY_FILE:./secrets/naver_maps_client.txt}
    enabled: ${NAVER_DIRECTIONS_ENABLED:true}

kakao:
  local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com/v2/local}
    api-key: ${KAKAO_LOCAL_API_KEY:}
    api-key-file: ${KAKAO_LOCAL_API_KEY_FILE:./secrets/kakao_local_api.txt}
    enabled: ${KAKAO_LOCAL_ENABLED:true}
    autocomplete-limit: ${KAKAO_LOCAL_AUTOCOMPLETE_LIMIT:10}
    cache-ttl-minutes: ${KAKAO_LOCAL_CACHE_TTL_MINUTES:1440}
